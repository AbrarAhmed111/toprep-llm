[project]
name = "llm-rag-starter"
version = "1.0.0"
description = "A production-oriented, domain-agnostic LLM and RAG starter template with multi-provider failover, rule-based intent routing, and grounded retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "langchain-openai>=1.6.2",
    "langchain-core>=1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
